    ["ऋण पूर्णांकाचा बेरजेचा व्यस्त नेहमी ________ असतो.","धन पूर्णांक"]
  ],
  tf:[
    ["सर्वात लहान नैसर्गिक संख्या 0 आहे.","चूक"],
    ["दोन ऋण पूर्णांकांची बेरीज त्या दोन्ही ऋण पूर्णांकांपेक्षा लहान असते.","बरोबर"],
    ["5 > 3 असते, म्हणून -5 > -3 असते.","चूक"],
    ["प्रत्येक धन पूर्णांक हा ऋण पूर्णांकापेक्षा मोठा असतो.","बरोबर"]
  ],
  m1:[],
  m2:[
    ["(-100) पेक्षा लहान व (-150) पेक्षा मोठ्या असणाऱ्या पाच संख्या लिहा.","-101, -102, -103, -148, -149 (अशा कोणत्याही 5 संख्या)."],
    ["जर आपण खोली धन मानली, तर पुढील मापे पूर्णांकांत दर्शवा: a) 35 मीटर खोली  b) 95 मीटर उंची","a) +35 m  b) -95 m."],
    ["तपासा की हे विधान सत्य आहे का: 34 + {90 + (-11)} = (34 + 90) + (-11)","डावी बाजू = 34 + 79 = 113; उजवी बाजू = 124 - 11 = 113 ⇒ विधान सत्य आहे."],
    ["तुम्ही +2 मजल्यावरून -3 बटण दाबल्यास कोणत्या मजल्यावर पोहोचाल? समीकरण लिहा.","(+2) + (-3) = -1 व्या मजल्यावर."]
  ],
  m3:[
    ["किंमत काढा: i) 79 - 68 + 28 - (-32)  ii) 153 + 218 - {29 - 367}","i) 79 - 68 + 28 + 32 = 71  ii) 371 - (-338) = 371 + 338 = 709."],
    ["एका बँक खात्यात ₹0 पासून सुरुवात करून ₹30, ₹40 व ₹50 जमा केले आणि ₹40, ₹50 व ₹60 काढले, तर खात्यावर शिल्लक किती?","एकूण जमा = ₹120; एकूण काढले = ₹150; शिल्लक = 120 - 150 = -₹30."],
    ["एका बँक खात्यातून ₹1, ₹2, ₹4, ₹8, ₹16, ₹32, ₹64 व ₹128 काढले आणि एकाच वेळी ₹256 जमा केले, तर शिल्लक किती?","एकूण काढले = ₹255; जमा = ₹256; शिल्लक = 0 - 255 + 256 = +₹1."]
  ],

}
};

var lessonWrap=root.querySelector("#sg6mp2Lessons"),school=root.querySelector("#sg6mp2School"),test=root.querySelector("#sg6mp2Test"),time=root.querySelector("#sg6mp2Time"),status=root.querySelector("#sg6mp2Status"),previewArea=root.querySelector("#sg6mp2PreviewArea"),paper=root.querySelector("#sg6mp2Paper"),btnGen=root.querySelector("#sg6mp2Generate"),btnKey=root.querySelector("#sg6mp2Key"),btnPrev=root.querySelector("#sg6mp2Preview"),btnPrint=root.querySelector("#sg6mp2Print"),btnAll=root.querySelector("#sg6mp2SelectAll");
var current=null,paperMode="qcas";

Object.keys(DB).forEach(function(k){
  var lab=document.createElement("label");
  lab.className="sg6mp2-lesson";
  lab.innerHTML='<input type="checkbox" class="sg6mp2-chk" value="'+k+'"> <span>प्रकरण '+k+'. '+DB[k].title+'</span>';
  lessonWrap.appendChild(lab);
});

function syncModeTabs(mode){
  paperMode=mode;
  var btns=root.querySelectorAll(".sg6mp2-tabBtn,.sg6mp2-miniTab");
  for(var i=0;i<btns.length;i++){
    if(btns[i].getAttribute("data-mode")===mode){btns[i].classList.add("sg6mp2-active")}
    else{btns[i].classList.remove("sg6mp2-active")}
  }
  if(current){render();}
}

var modeBtns=root.querySelectorAll(".sg6mp2-tabBtn,.sg6mp2-miniTab");
for(var mb=0;mb<modeBtns.length;mb++){
  modeBtns[mb].addEventListener("click",function(){syncModeTabs(this.getAttribute("data-mode"))});
}

function esc(v){var d=document.createElement("div");d.textContent=v==null?"":String(v);return d.innerHTML}
function shuf(a){var x=a.slice();for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=x[i];x[i]=x[j];x[j]=t}return x}
function checked(){return Array.prototype.slice.call(root.querySelectorAll(".sg6mp2-chk:checked")).map(function(x){return x.value})}
function msg(t,good){status.className="sg6mp2-status "+(good?"sg6mp2-ok":"sg6mp2-warn");status.textContent=t}
function pool(ids,type){var a=[];ids.forEach(function(id){a=a.concat(DB[id][type]||[])});return shuf(a)}

function generate(){
  var ids=checked();
  if(!ids.length){msg("कृपया किमान एक पाठ निवडा.",false);alert("कृपया किमान एक पाठ निवडा.");return}
  var p={mcq:pool(ids,"mcq"),fill:pool(ids,"fill"),tf:pool(ids,"tf"),m1:pool(ids,"m1"),m2:pool(ids,"m2"),m3:pool(ids,"m3"),m4:pool(ids,"m4")};
  var cfg;
  if(ids.length===1){
    cfg=DB[ids[0]].blueprint;
  } else {
    var wMcq=Math.min(4,p.mcq.length);
    var wFill=Math.min(2,p.fill.length);
    var wTf=Math.min(2,p.tf.length);
    var wM4=p.m4.length>=1?1:0;
    var wM3=p.m3.length>=1?1:0;
    var used=wMcq+wFill+wTf+wM3*3+wM4*4;
    var rem=20-used;
    var wM2=Math.min(Math.floor(rem/2),p.m2.length);
    rem-=wM2*2;
    var wM1=Math.min(rem,p.m1.length);
    rem-=wM1;
    if(rem>0 && p.fill.length>wFill){var addF=Math.min(rem,p.fill.length-wFill);wFill+=addF;rem-=addF;}
    if(rem>0 && p.tf.length>wTf){var addT=Math.min(rem,p.tf.length-wTf);wTf+=addT;rem-=addT;}
    if(rem>0 && p.mcq.length>wMcq){var addM=Math.min(rem,p.mcq.length-wMcq);wMcq+=addM;rem-=addM;}
    cfg={mcq:wMcq,fill:wFill,tf:wTf,m1:wM1,m2:wM2,m3:wM3,m4:wM4};
  }
  var sel={
    mcq:p.mcq.slice(0,cfg.mcq),
    fill:p.fill.slice(0,cfg.fill),
    tf:p.tf.slice(0,cfg.tf),
    m1:p.m1.slice(0,cfg.m1),
    m2:p.m2.slice(0,cfg.m2),
    m3:p.m3.slice(0,cfg.m3),
    m4:p.m4.slice(0,cfg.m4)
  };
  var totalMarks=sel.mcq.length+sel.fill.length+sel.tf.length+sel.m1.length+sel.m2.length*2+sel.m3.length*3+sel.m4.length*4;
  current={school:school.value.trim()||"शाळेचे नाव",test:test.value.trim()||"अध्ययन आधारित मूल्यमापन (LBA)",marks:totalMarks,time:time.value,sel:sel};
  render();
  previewArea.style.display="block";
  btnKey.disabled=false;btnPrev.disabled=false;btnPrint.disabled=false;
  btnKey.textContent="&#x1f511; उत्तरतालिका दाखवा / लपवा";
  msg(totalMarks+" गुणांची प्रश्नपत्रिका यशस्वीरीत्या तयार झाली.",true);
  setTimeout(function(){try{previewArea.scrollIntoView({behavior:"smooth",block:"start"})}catch(e){previewArea.scrollIntoView()}},60);
}

function render(){
  var d=current,s=d.sel,isAns=(paperMode==="qcas"),h="",key="",qn=1;
  paper.className="sg6mp2-sheet"+(isAns?"":" sg6mp2-qpOnly");
  h+='<div class="sg6mp2-header">';
  h+='<div class="sg6mp2-school">'+esc(d.school)+'</div>';
  h+='<div class="sg6mp2-test">'+esc(d.test)+'</div>';
  h+='<div class="sg6mp2-modeBadge">'+(isAns?"प्रश्न-कम-उत्तरपत्रिका (Question Cum Answer Sheet)":"प्रश्नपत्रिका (Question Paper)")+'</div>';
  h+='<div class="sg6mp2-meta"><span>इयत्ता: 6 वी</span><span>विषय: गणित प्रकाश (भाग - 2)</span><span>एकूण गुण: '+d.marks+'</span><span>वेळ: '+d.time+' मिनिटे</span></div>';
  if(isAns){
    h+='<div class="sg6mp2-studentRow"><span>विद्यार्थ्याचे नाव: ____________________________________</span><span>हजेरी क्र.: ______</span><span>दिनांक: ___/___/20__</span></div>';
  }
  h+='</div>';

  key='<div id="sg6mp2KeySheet" class="sg6mp2-keySheet"><div class="sg6mp2-keyTitle">उत्तरतालिका (Answer Key)</div>';

  if(s.mcq.length){
    h+='<div class="sg6mp2-sec"><div class="sg6mp2-qhead"><span>प्र. '+qn+'. योग्य पर्याय निवडून पूर्ण उत्तर लिहा.</span><span class="sg6mp2-qmarks">['+s.mcq.length+' × 1 = '+s.mcq.length+' गुण]</span></div>';
    key+='<div class="sg6mp2-qhead"><span>प्र. '+qn+'. बहुपर्यायी उत्तरे:</span></div>';
    s.mcq.forEach(function(x,i){
      h+='<div class="sg6mp2-qblock"><div class="sg6mp2-q">'+(i+1)+') '+esc(x[0])+'</div><div class="sg6mp2-options">';
      x[1].forEach(function(o,j){h+='<div>'+String.fromCharCode(65+j)+') '+esc(o)+'</div>'});
      h+='</div>';
      if(isAns){h+='<div class="sg6mp2-ansLine"><span>उत्तर:</span><span class="sg6mp2-line"></span></div>';}
      h+='</div>';
      key+='<div class="sg6mp2-keyAns">'+(i+1)+') '+esc(x[2])+'</div>';
    });
    h+='</div>';qn++;
  }

  if(s.fill.length){
    h+='<div class="sg6mp2-sec"><div class="sg6mp2-qhead"><span>प्र. '+qn+'. रिकाम्या जागा योग्य उत्तरांनी भरा.</span><span class="sg6mp2-qmarks">['+s.fill.length+' × 1 = '+s.fill.length+' गुण]</span></div>';
    key+='<div class="sg6mp2-qhead"><span>प्र. '+qn+'. रिकाम्या जागा:</span></div>';
    s.fill.forEach(function(x,i){
      h+='<div class="sg6mp2-qblock"><div class="sg6mp2-q">'+(i+1)+') '+esc(x[0])+'</div>';
      if(isAns){h+='<div class="sg6mp2-ansLine"><span>उत्तर:</span><span class="sg6mp2-line"></span></div>';}
      h+='</div>';
      key+='<div class="sg6mp2-keyAns">'+(i+1)+') '+esc(x[1])+'</div>';
    });
    h+='</div>';qn++;
  }

  if(s.tf.length){
    h+='<div class="sg6mp2-sec"><div class="sg6mp2-qhead"><span>प्र. '+qn+'. खालील विधाने चूक की बरोबर ते लिहा.</span><span class="sg6mp2-qmarks">['+s.tf.length+' × 1 = '+s.tf.length+' गुण]</span></div>';
    key+='<div class="sg6mp2-qhead"><span>प्र. '+qn+'. चूक की बरोबर:</span></div>';
    s.tf.forEach(function(x,i){
      h+='<div class="sg6mp2-qblock"><div class="sg6mp2-q">'+(i+1)+') '+esc(x[0])+'</div>';
      if(isAns){h+='<div class="sg6mp2-ansLine"><span>उत्तर:</span><span class="sg6mp2-line"></span></div>';}
      h+='</div>';
      key+='<div class="sg6mp2-keyAns">'+(i+1)+') '+esc(x[1])+'</div>';
    });
    h+='</div>';qn++;
  }

  if(s.m1.length){
    h+='<div class="sg6mp2-sec"><div class="sg6mp2-qhead"><span>प्र. '+qn+'. खालील प्रश्नांची एका वाक्यात / एका पायरीत उत्तरे लिहा.</span><span class="sg6mp2-qmarks">['+s.m1.length+' × 1 = '+s.m1.length+' गुण]</span></div>';
    key+='<div class="sg6mp2-qhead"><span>प्र. '+qn+'. एक गुणांची उत्तरे:</span></div>';
    s.m1.forEach(function(x,i){
      h+='<div class="sg6mp2-qblock"><div class="sg6mp2-q">'+(i+1)+') '+esc(x[0])+'</div>';
      if(isAns){h+='<div class="sg6mp2-ansLine"><span>उत्तर:</span><span class="sg6mp2-line"></span></div>';}
      h+='</div>';
      key+='<div class="sg6mp2-keyAns">'+(i+1)+') '+esc(x[1])+'</div>';
    });
    h+='</div>';qn++;
  }

  if(s.m2.length){
    h+='<div class="sg6mp2-sec"><div class="sg6mp2-qhead"><span>प्र. '+qn+'. खालील उदाहरणे सोडवा.</span><span class="sg6mp2-qmarks">['+s.m2.length+' × 2 = '+(s.m2.length*2)+' गुण]</span></div>';
    key+='<div class="sg6mp2-qhead"><span>प्र. '+qn+'. दोन गुणांची उत्तरे:</span></div>';
    s.m2.forEach(function(x,i){
      h+='<div class="sg6mp2-qblock"><div class="sg6mp2-q">'+(i+1)+') '+esc(x[0])+'</div>';
      if(isAns){h+='<div class="sg6mp2-box"></div>';}
      h+='</div>';
      key+='<div class="sg6mp2-keyAns">'+(i+1)+') '+esc(x[1])+'</div>';
    });
    h+='</div>';qn++;
  }

  if(s.m3.length){
    h+='<div class="sg6mp2-sec"><div class="sg6mp2-qhead"><span>प्र. '+qn+'. खालील उदाहरणे पायरी-पायरीने सोडवा.</span><span class="sg6mp2-qmarks">['+s.m3.length+' × 3 = '+(s.m3.length*3)+' गुण]</span></div>';
    key+='<div class="sg6mp2-qhead"><span>प्र. '+qn+'. तीन गुणांची उत्तरे:</span></div>';
    s.m3.forEach(function(x,i){
      h+='<div class="sg6mp2-qblock"><div class="sg6mp2-q">'+(i+1)+') '+esc(x[0])+'</div>';

      h+='</div>';
      key+='<div class="sg6mp2-keyAns">'+(i+1)+') '+esc(x[1])+'</div>';

  if(s.m4.length){
    h+='<div class="sg6mp2-sec"><div class="sg6mp2-qhead"><span>प्र. '+qn+'. खालील प्रश्न सविस्तर सोडवा.</span><span class="sg6mp2-qmarks">['+s.m4.length+' × 4 = '+(s.m4.length*4)+' गुण]</span></div>';
    key+='<div class="sg6mp2-qhead"><span>प्र. '+qn+'. चार गुणांची उत्तरे:</span></div>';
    s.m4.forEach(function(x,i){
      h+='<div class="sg6mp2-qblock"><div class="sg6mp2-q">'+(i+1)+') '+esc(x[0])+'</div>';
      if(isAns){h+='<div class="sg6mp2-box sg6mp2-longbox"></div>';}
      h+='</div>';
      key+='<div class="sg6mp2-keyAns">'+(i+1)+') '+esc(x[1])+'</div>';
    });
    h+='</div>';
  }

  h+='<div class="sg6mp2-watermark">SmartGuruji</div>';
  key+='</div>';
  paper.innerHTML=h+key;
}

btnGen.addEventListener("click",function(e){e.preventDefault();generate()});
btnAll.addEventListener("click",function(){var c=root.querySelectorAll(".sg6mp2-chk"),all=true;for(var i=0;i<c.length;i++)if(!c[i].checked){all=false;break}for(var j=0;j<c.length;j++)c[j].checked=!all});
btnKey.addEventListener("click",function(){if(!current)return;var s=paper.querySelector("#sg6mp2KeySheet");if(!s)return;var show=s.style.display!=="block";s.style.display=show?"block":"none";btnKey.textContent=show?"&#x1f510; उत्तरतालिका लपवा":"&#x1f511; उत्तरतालिका दाखवा / लपवा"});
btnPrev.addEventListener("click",function(){if(!current)return;try{previewArea.scrollIntoView({behavior:"smooth",block:"start"})}catch(e){previewArea.scrollIntoView()}});
btnPrint.addEventListener("click",function(){if(!current){alert("प्रथम पेपर तयार करा.");return}window.print()});
})();
